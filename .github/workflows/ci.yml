name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверить JSON
        run: |
          for f in module.json lang/*.json; do
            jq empty "$f"
          done

      - name: Проверить синтаксис JS
        run: find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Проверить, что id модуля совпадает в manifest и constants.mjs
        run: |
          ID="$(jq -r .id module.json)"
          grep -q "MODULE_ID = \"${ID}\"" scripts/constants.mjs
